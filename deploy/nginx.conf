# Configuration nginx pour Mon Plan Resilience 976 sur VPS.
#
# Sert le build statique (dist/) et proxifie /api/* vers le backend
# analytics (server/analytics-server.mjs, ecoute en local sur 127.0.0.1:8787).
#
# Installation :
#   1. Remplacer DOMAINE_A_REMPLACER par le vrai nom de domaine.
#   2. Copier ce fichier dans /etc/nginx/sites-available/resilience-976
#   3. ln -s /etc/nginx/sites-available/resilience-976 /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d DOMAINE_A_REMPLACER
#      (ajoute automatiquement le bloc HTTPS + la redirection 80 -> 443)

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE_A_REMPLACER;

    root /var/www/resilience-976/dist;
    index index.html;

    # Memes en-tetes de securite que public/_headers (Netlify), adaptes au
    # meme-origine puisque /api/* est maintenant servi par ce meme domaine.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://webissimo.developpement-durable.gouv.fr; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # API du backend analytics (evenements, feedback, diagnostics, tableaux de bord).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets buildes (hash dans le nom de fichier -> cache long et immuable).
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (vue-router history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
