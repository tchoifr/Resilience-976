# Configuration nginx pour Mon Plan Resilience 976 sur VPS.
#
# Sert le build statique (dist/) et proxifie /api/* vers le backend
# analytics (server/analytics-server.mjs, ecoute en local sur 127.0.0.1:8787).
#
# Installation :
#   1. Remplacer DOMAINE_A_REMPLACER par le vrai nom de domaine.
#   2. Copier ce fichier dans /etc/nginx/sites-available/resilience-976
#   3. ln -s /etc/nginx/sites-available/resilience-976 /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d DOMAINE_A_REMPLACER
#      (ajoute automatiquement le bloc HTTPS + la redirection 80 -> 443)

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE_A_REMPLACER;

    root /var/www/resilience-976/dist;
    index index.html;

    # Memes en-tetes de securite que public/_headers (Netlify), adaptes au
    # meme-origine puisque /api/* est maintenant servi par ce meme domaine.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://webissimo.developpement-durable.gouv.fr; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # Isolation entre origines (releve par OWASP ZAP). COOP isole le contexte
    # de navigation, CORP empeche un autre site de charger nos ressources.
    # COEP (require-corp) n'est volontairement pas pose : il bloquerait la
    # video hebergee sur webissimo.developpement-durable.gouv.fr, qui n'envoie
    # pas d'en-tete CORP.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # A activer une fois le domaine servi en HTTPS par certbot. Non pose par
    # defaut : annoncer HSTS avant d'avoir un certificat valide rendrait le
    # site injoignable pour les navigateurs qui ont deja vu l'en-tete.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ATTENTION : nginx n'herite les add_header du niveau superieur que si le
    # bloc courant n'en declare aucun. Ajouter un seul add_header dans un
    # location ci-dessous ferait disparaitre, en silence, tous les en-tetes de
    # securite declares ici. Les redeclarer alors integralement.

    # Routes d'exploitation : tableau de bord, graphe et profils de visiteurs,
    # statistiques. Sans authentification, elles permettaient de lister les
    # identifiants de visiteurs puis de lire leurs reponses au diagnostic.
    #
    # Creer le fichier de mots de passe :
    #   htpasswd -c /etc/nginx/.htpasswd-resilience <utilisateur>
    #
    # Le serveur applique la meme regle de son cote des que
    # ANALYTICS_READ_TOKEN est defini : si cette configuration est oubliee ou
    # ecrasee, les routes restent fermees.
    location ~ ^/api/(dashboard|visitors/(graph|profile)|[a-z-]+/stats|diagnostic-responses/stats) {
        auth_basic "Resilience 976 - exploitation";
        auth_basic_user_file /etc/nginx/.htpasswd-resilience;

        # Redeclares parce que ce bloc porte des add_header : sans cela, ceux
        # du niveau server ne s'appliqueraient plus a ces reponses.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://webissimo.developpement-durable.gouv.fr; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages du tableau de bord : protegees elles aussi, pour que le navigateur
    # demande les identifiants a la navigation et les reutilise ensuite sur les
    # appels /api. Sans cela, la page s'afficherait vide sans expliquer pourquoi.
    location /tableau-de-bord {
        auth_basic "Resilience 976 - exploitation";
        auth_basic_user_file /etc/nginx/.htpasswd-resilience;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://webissimo.developpement-durable.gouv.fr; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        try_files $uri /index.html;
    }

    # API du backend analytics (evenements, feedback, diagnostics, compteurs
    # publics de la banniere d'accueil).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets buildes (hash dans le nom de fichier -> cache long et immuable).
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (vue-router history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
